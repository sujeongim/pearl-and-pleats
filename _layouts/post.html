---
layout: default
---
<article class="entry">
  <p class="entry-date">{% include korean-date.html date=page.date %}{% if page.weather %} · {{ page.weather }}{% endif %}</p>
  <h1 class="entry-title">{{ page.title }}</h1>
  <div class="entry-body">
    {{ content }}
  </div>
  <p class="signature">— S.</p>
</article>

<nav class="pager">
  {% if page.previous %}<a class="prev" href="{{ page.previous.url | relative_url }}">← {{ page.previous.title }}</a>{% else %}<span></span>{% endif %}
  {% if page.next %}<a class="next" href="{{ page.next.url | relative_url }}">{{ page.next.title }} →</a>{% endif %}
</nav>
